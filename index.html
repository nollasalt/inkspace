<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'"><title>墨境 · 无限笔记</title>
<link rel="stylesheet" href="vendor/pdf_viewer.css"><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/katex.min.css">
<link rel="stylesheet" href="vendor/highlight.min.css">
<body>
<header>
<div class="document-controls"><button id="sidebar-toggle" aria-label="切换页面侧栏" aria-expanded="true">☰</button><div class="brand">墨境</div>
<details class="menu"><summary>文件 ▾</summary><div class="menu-panel"><button id="new">新建笔记 <kbd>Ctrl+N</kbd></button><button id="load">打开笔记… <kbd>Ctrl+O</kbd></button><button id="save">保存 <kbd>Ctrl+S</kbd></button><button id="save-as">另存为… <kbd>Ctrl+Shift+S</kbd></button><hr><button id="pdf-import">导入 PDF 到当前页…</button><button id="pdf-export">导出当前页的 PDF 批注…</button><button id="svg">导出当前页 SVG…</button></div></details>
<span id="document-title">未命名笔记</span></div>
<div class="tools" role="toolbar" aria-label="画布工具"><button data-tool="pen" class="active" title="画笔 (P)">✎ 画笔</button><button data-tool="erase" title="删除整条笔迹 (E)">⌫ 橡皮</button><button data-tool="select" title="框选并移动 (V)">▧ 选择</button><button data-tool="pan" title="移动 (H)，或按住空格">✥ 移动</button><button data-tool="text" title="添加 Markdown (T)">T 文本</button><button data-tool="shape" title="添加图形 (S)">◇ 图形</button><button data-tool="pdftext" title="选取及复制 PDF 原文">PDF 文字</button></div>
<div class="toolbar-actions"><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Y">↷</button><details class="menu"><summary>页面设置 ▾</summary><div class="menu-panel settings-panel"><label>背景<select id="background-kind"><option value="blank">纯色</option><option value="dots" selected>点阵</option><option value="ruled">横线</option><option value="grid">网格</option></select></label><label>底色<input id="background-color" type="color" value="#f6f7f5"></label><label>文字字号<select id="text-size"><option value="12">12</option><option value="14">14</option><option value="16" selected>16</option><option value="18">18</option><option value="20">20</option><option value="24">24</option></select></label><label>背景间距<select id="background-spacing"><option value="auto" selected>跟随文字字号</option><option value="16">16</option><option value="24">24</option><option value="32">32</option><option value="48">48</option></select></label></div></details></div>
</header>
<div id="tool-options"><span id="pen-options"><label>颜色 <input id="color" type="color" value="#263f43"></label><label>笔粗 <select id="width"><option value="1">极细 · 1</option><option value="2">细 · 2</option><option value="4" selected>中 · 4</option><option value="8">粗 · 8</option></select></label></span><span id="shape-options" hidden><select id="shape-kind" aria-label="图形类型"><option value="rect">矩形</option><option value="ellipse">椭圆</option><option value="line">直线</option><option value="arrow">箭头</option></select></span><span id="pdf-options" hidden><button id="pdf-highlight">高亮选中文字</button></span><span class="shortcut-hint">Ctrl+V 粘贴图片或文字 · 空格拖动画布</span></div>
<div id="workspace"><aside id="sidebar"><div class="sidebar-heading"><strong>页面</strong><span id="page-count"></span><button id="page-add" title="添加无限画布页面">＋</button></div><nav id="page-list" aria-label="笔记页面"></nav><div class="page-actions"><button id="page-rename">重命名</button><button id="page-delete">删除页面</button></div><p class="sidebar-help">每一页都是无限画布<br>内容自动保留，保存写入整本笔记</p></aside>
<main id="viewport"><div id="scene"><div id="paper"></div><div id="pdf-pages"></div><canvas id="ink"></canvas><canvas id="ink-stream"></canvas><canvas id="ink-live"></canvas><div id="notes"></div><div id="selection"></div></div><div class="hint">笔尖书写 · 鼠标双击添加文本 · 手指移动 · 双指缩放 · 滚轮缩放<br>鼠标拖动框选 · 双击文本编辑 · Delete 删除选中内容</div><div class="zoom"><button id="out" title="缩小">−</button><button id="reset">100%</button><button id="in" title="放大">＋</button><button id="home">回到内容</button></div><div id="pen-cursor" hidden></div></main></div>
<dialog id="editor"><form method="dialog"><div class="dialog-title">Markdown 文本框 <button value="cancel" aria-label="关闭">×</button></div><label class="editor-help">文本框宽度 <input id="note-width" type="number" min="160" max="4000" step="40" value="560"> px（可拖动右下角调整）</label><textarea id="source" spellcheck="false" placeholder="# 标题&#10;&#10;行内公式：$E=mc^2$&#10;独立公式：$$x^2+y^2=z^2$$&#10;代码：三个反引号后写 python 或 javascript"></textarea><p class="editor-help">公式：$…$ 或 $$…$$ · 代码：三个反引号 + 语言名（python、javascript、cpp 等）</p><div class="dialog-footer"><button id="delete-note" type="button">删除文本框</button><button value="cancel">取消</button><button id="commit" value="default" class="primary">应用</button></div></form></dialog>
<dialog id="action-dialog"><p id="action-message"></p><div id="action-choices" class="dialog-footer"></div></dialog><dialog id="rename-dialog"><form method="dialog"><div class="dialog-title">重命名页面</div><input id="page-name" maxlength="100" aria-label="页面名称"><div class="dialog-footer"><button value="cancel">取消</button><button value="save" class="primary">保存</button></div></form></dialog>
<input id="pdf-file" type="file" accept="application/pdf,.pdf" hidden><input id="file" type="file" accept="application/json,.json" hidden><div id="toast" role="status"></div>
<script src="vendor/content.js"></script><script src="desktop/ink-renderer.js"></script><script src="renderer.js"></script><script src="app.js"></script>
<script src="vendor/pdf-api.js"></script><script src="pdf.js"></script><script src="desktop/bridge.js"></script><script src="desktop/workspace.js"></script></body></html>
